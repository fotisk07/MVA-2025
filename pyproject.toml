[project]
name = "moleculecs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "hydra-core>=1.3.2",
    "nltk>=3.8.0",
    "pandas>=1.5.0",
    "periodictable>=2.0.2",
    "pre-commit>=4.3.0",
    "rdkit>=2023.3.1",
    "seaborn>=0.13.2",
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "tqdm>=4.65.0",
    "transformers>=4.30.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "ruff>=0.14.9",
    "ty>=0.0.8",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

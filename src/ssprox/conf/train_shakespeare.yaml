io:
  out_dir: out-shakespeare-char
  eval_interval: 250
  log_interval: 10
  eval_iters: 200
  eval_only: false
  always_save_checkpoint: false
  init_from: scratch

wandb:
  log: false
  project: shakespeare-char
  run_name: mini-gpt

data:
  name: shakespeare_char
  data_dir: nanoGPT/data/shakespeare_char
  gradient_accumulation_steps: 1
  batch_size: 64
  block_size: 256

model:
  n_layer: 6
  n_head: 6
  n_embd: 384
  dropout: 0.2
  bias: false

optim:
  learning_rate: 1e-3
  max_iters: 5000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.99
  grad_clip: 1.0

lr:
  decay_lr: true
  warmup_iters: 100
  lr_decay_iters: 5000
  min_lr: 1e-4

system:
  device: cuda
  dtype: auto
  compile: true
  seed: 1337

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
